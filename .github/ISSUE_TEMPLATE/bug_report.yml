name: Bug report
description: Something in Luminara doesn't work as it should.
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Luminara version
      description: Settings, About.
      placeholder: "0.5.237"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: "macOS 26.1, MacBook Pro M3 Pro, 36 GB"
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Voice model
      description: The model you were using, if it matters.
      placeholder: "Kokoro"
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Drop an EPUB on Convert
        2. Choose Kokoro
        3. Start converting
  - type: textarea
    id: log
    attributes:
      label: Log
      description: >
        The relevant part of the newest file in ~/Luminara/Logs/. Read it first: it can include
        text from your book, and paths with your user name.
      render: text
