name: Feature request
description: Suggest something new, or a change to how something works.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: input
    id: version
    attributes:
      label: Luminara version
      placeholder: "0.5.237"
